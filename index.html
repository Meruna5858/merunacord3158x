<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Odamız</title>
<style>
:root{--bg:#14161c;--panel:#1d2029;--line:#2c3040;--text:#e8e9ee;--dim:#8d92a3;--acc:#5ee0b0;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
[hidden]{display:none!important}
#join{max-width:360px;margin:12vh auto;padding:24px;display:grid;gap:12px}
#join h1{margin:0 0 4px;font-size:28px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px 12px;background:var(--panel);color:var(--text)}
button{cursor:pointer}
button.main{background:var(--acc);color:#0b1f17;border:0;font-weight:600}
button.off{background:var(--bad);color:#fff;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc)}
#app{display:flex;flex-direction:column;height:100%}
#screens{display:grid;gap:8px;padding:8px}
#screens:empty{display:none}
#screens video{width:100%;max-height:55vh;background:#000;border-radius:8px}
#log{flex:1;overflow:auto;padding:12px 16px}
#log div{padding:2px 0;word-break:break-word}
#log .sys{color:var(--dim);font-style:italic}
form{display:flex;gap:8px;padding:8px}
form input{flex:1;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap}
#who{color:var(--dim);margin-left:auto;font-size:14px}
</style>
</head>
<body>
<div id="join">
  <h1>Odamız</h1>
  <input id="nick" placeholder="Adın" maxlength="20" autocomplete="off">
  <input id="room" type="password" placeholder="Oda şifresi (en az 6 karakter, üçünüzde aynı)" maxlength="60" autocomplete="off">
  <button class="main" id="go">Odaya gir</button>
</div>

<div id="app" hidden>
  <div id="screens"></div>
  <div id="log"></div>
  <form id="f"><input id="m" placeholder="Mesaj yaz" autocomplete="off"><button class="main">Gönder</button></form>
  <div id="bar">
    <button id="mute">Mikrofonu kapat</button>
    <button id="share">Ekran paylaş</button>
    <span id="who"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const clean = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
let peer, hostId, me, name, room, mic, scr, amHost = false;
const peers = {};   // id -> {conn, name}
const scrCalls = {}; // id -> call

function log(t, cls){
  const d = document.createElement('div');
  d.textContent = t; if (cls) d.className = cls;
  $('#log').append(d); $('#log').scrollTop = 1e9;
}
function who(){
  const n = Object.values(peers).map(p => p.name || '?');
  $('#who').textContent = 'Odada: ' + [name, ...n].join(', ');
}

$('#go').onclick = async () => {
  name = $('#nick').value.trim();
  room = $('#room').value.trim();
  if (!name) return;
  if (room.length < 6) { alert('Şifre en az 6 karakter olmalı.'); return; }
  const gate = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kapi:' + room));
  const gateHex = [...new Uint8Array(gate)].map(b => b.toString(16).padStart(2, '0')).join('');
  if (gateHex !== '5cfb99b433d3f867ce7ba6349e3bef52327ada9a068b8d6c7488fb2afee6f57f') { alert('Şifre yanlış.'); return; }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('odamiz:' + room));
  room = [...new Uint8Array(buf)].slice(0, 12).map(b => b.toString(16).padStart(2, '0')).join('');
  try {
    mic = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  } catch(e) { mic = null; }
  $('#join').hidden = true; $('#app').hidden = false;
  if (!mic) log('Mikrofon izni verilmedi, sadece yazabilirsin.', 'sys');
  hostId = 'tr-' + room + '-host';
  openPeer(hostId, true);
};

function openPeer(id, asHost){
  if (peer) peer.destroy();
  amHost = asHost;
  peer = new Peer(id);
  peer.on('open', () => {
    me = id;
    if (asHost) log('Odayı sen açtın. Arkadaşların aynı şifreyle girsin.', 'sys');
    else connect(hostId);
    who();
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && asHost) {
      openPeer('tr-' + room + '-' + clean(name) + Math.random().toString(36).slice(2, 6), false);
    } else if (e.type !== 'peer-unavailable') {
      log('Bağlantı hatası: ' + e.type, 'sys');
    }
  });
  peer.on('connection', c => setup(c, false));
  peer.on('call', call => {
    const isScreen = call.metadata && call.metadata.screen;
    call.answer(isScreen ? undefined : (mic || new MediaStream()));
    call.on('stream', s => isScreen ? showScreen(call.peer, s) : playAudio(call.peer, s));
    call.on('close', () => isScreen ? $('#v-' + call.peer)?.remove() : $('#a-' + call.peer)?.remove());
  });
}

function connect(id){
  if (peers[id] || id === me) return;
  setup(peer.connect(id, {reliable:true}), true);
}

function setup(c, initiator){
  const id = c.peer;
  if (peers[id]) { c.close(); return; }
  peers[id] = {conn:c, name:''};
  c.on('open', () => {
    c.send({t:'hello', name});
    if (amHost) c.send({t:'peers', list:Object.keys(peers).filter(x => x !== id)});
    if (initiator) {
      const call = peer.call(id, mic || new MediaStream());
      call.on('stream', s => playAudio(id, s));
      call.on('close', () => $('#a-' + id)?.remove());
    }
    if (scr) shareTo(id);
  });
  c.on('data', d => {
    if (d.t === 'hello') { peers[id].name = d.name; log(d.name + ' odaya katıldı.', 'sys'); who(); }
    else if (d.t === 'peers') d.list.forEach(connect);
    else if (d.t === 'msg') log(d.name + ': ' + d.text);
  });
  c.on('close', () => {
    log((peers[id]?.name || 'Biri') + ' ayrıldı.', 'sys');
    delete peers[id];
    $('#a-' + id)?.remove(); $('#v-' + id)?.remove();
    who();
  });
}

function playAudio(id, s){
  let a = $('#a-' + id);
  if (!a) { a = document.createElement('audio'); a.id = 'a-' + id; a.autoplay = true; document.body.append(a); }
  a.srcObject = s;
}
function showScreen(id, s){
  let v = $('#v-' + id);
  if (!v) { v = document.createElement('video'); v.id = 'v-' + id; v.autoplay = true; v.playsInline = true; v.controls = true; $('#screens').append(v); }
  v.srcObject = s;
}

$('#f').onsubmit = e => {
  e.preventDefault();
  const text = $('#m').value.trim(); if (!text) return;
  Object.values(peers).forEach(p => p.conn.open && p.conn.send({t:'msg', name, text}));
  log(name + ': ' + text); $('#m').value = '';
};

$('#mute').onclick = e => {
  if (!mic) return;
  const t = mic.getAudioTracks()[0]; t.enabled = !t.enabled;
  e.target.textContent = t.enabled ? 'Mikrofonu kapat' : 'Mikrofonu aç';
  e.target.classList.toggle('off', !t.enabled);
};

function shareTo(id){
  scrCalls[id] = peer.call(id, scr, {metadata:{screen:true}});
}
function stopShare(){
  Object.values(scrCalls).forEach(c => c.close());
  scr?.getTracks().forEach(t => t.stop());
  scr = null;
  $('#share').textContent = 'Ekran paylaş'; $('#share').classList.remove('off');
}
$('#share').onclick = async () => {
  if (scr) return stopShare();
  try {
    scr = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
  } catch(e) { return; }
  scr.getVideoTracks()[0].onended = stopShare;
  Object.keys(peers).forEach(shareTo);
  $('#share').textContent = 'Paylaşımı durdur'; $('#share').classList.add('off');
};
</script>
</body>
</html>
